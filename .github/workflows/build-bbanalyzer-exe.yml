name: Build bbanalyzer.exe

on:
  push:
    # branches must be listed explicitly: with only `tags:` set, branch pushes would not trigger
    branches:
      - "**"
    paths:
      - "tools/bbanalyzer/**"
      - ".github/workflows/build-bbanalyzer-exe.yml"
    tags:
      - "bbanalyzer-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tools/bbanalyzer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib pytest pyinstaller

      - name: Install orangebox
        # orangebox's wheel declares a broken console-script entry point, so pip reports an
        # error and exits non-zero although the library installs fine. Verify by importing.
        run: |
          python -m pip install orangebox
          python -c "import orangebox; print('orangebox', orangebox.__file__)"

      - name: Test (includes the GUI test)
        run: python -m pytest -q

      - name: Build bbanalyzer.exe (window)
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name bbanalyzer
          --paths . --collect-submodules bbanalyzer
          --exclude-module pytest --exclude-module IPython
          --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide6
          bbanalyzer_gui.py

      - name: Build bbanalyzer-cli.exe (command line)
        run: >
          python -m PyInstaller --noconfirm --onefile --console --name bbanalyzer-cli
          --paths . --collect-submodules bbanalyzer
          --exclude-module tkinter --exclude-module pytest --exclude-module IPython
          --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide6
          bbanalyzer_app.py

      - name: Smoke test
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from synth import make_flight; make_flight(seed=5)[0].to_csv('smoke.csv', index=False)"
          ./dist/bbanalyzer-cli.exe analyze smoke.csv --mass 1.1 --prop 7 --motor-range 1080,2000
          if (-not (Test-Path smoke_report.html)) { throw "CLI did not write a report" }
          # the window must start and stay up (a crash on start would exit immediately)
          $p = Start-Process -FilePath ./dist/bbanalyzer.exe -ArgumentList "smoke.csv" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "bbanalyzer.exe exited on start (code $($p.ExitCode))" }
          Get-Process -Name bbanalyzer -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: bbanalyzer-windows
          path: |
            tools/bbanalyzer/dist/bbanalyzer.exe
            tools/bbanalyzer/dist/bbanalyzer-cli.exe
          retention-days: 90

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/bbanalyzer-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tools/bbanalyzer/dist/bbanalyzer.exe
            tools/bbanalyzer/dist/bbanalyzer-cli.exe
