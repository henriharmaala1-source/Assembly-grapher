name: build nav-sim (Windows exe)

# Builds nav_sim.exe on a Windows runner and uploads it as a downloadable
# artifact — so you get a prebuilt .exe with no local toolchain at all.
# After a run: repo -> Actions tab -> this workflow -> latest run ->
# Artifacts -> download "nav_sim-windows-x64" (exe + the OpenCV DLLs it needs).

on:
  push:
    paths:
      - 'nav-sim/**'
      - '.github/workflows/nav-sim-windows.yml'
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nav-sim
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # vcpkg is preinstalled on the runner; cache the built OpenCV so only the
      # first run pays the ~15-20 min compile.
      - name: Cache OpenCV (vcpkg)
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-opencv4-x64-windows-v1

      - name: Install OpenCV
        run: vcpkg install opencv4:x64-windows

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package (exe + DLLs)
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/*.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item build/*.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item build/Release/*.dll dist/ -ErrorAction SilentlyContinue
          # Fallback: pull the OpenCV runtime DLLs straight from vcpkg so the
          # zip is self-contained even if app-local deploy didn't copy them.
          Copy-Item C:/vcpkg/installed/x64-windows/bin/*.dll dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: nav_sim-windows-x64
          path: nav-sim/dist
          if-no-files-found: error
