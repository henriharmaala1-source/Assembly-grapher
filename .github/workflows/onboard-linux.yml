name: build + test onboard (flight software)

# The code that flies had no CI at all. nav-sim's Windows job compiles a few of
# onboard's tracker sources into kestrel.exe, which caught header breaks by
# accident, but onboard's own executable and its seventeen tests -- the SITL
# autonomy run, the MAVLink codec against golden frames, the mode safety
# layers, the voxel layer's closed loop -- never ran anywhere but a desk.
#
# Ubuntu 24.04 is the Pi 5's OS family and ships OpenCV 4.6 with the contrib
# modules onboard needs (tracking for CSRT/KCF, dnn). No RealSense SDK: the
# D435i is loaded at run time, and test_voxel_nav drives the voxel layer from
# the simulated camera instead.

on:
  push:
    paths:
      - 'onboard/**'
      - 'navcore/**'
      - '.github/workflows/onboard-linux.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    # The suite takes well under a minute on a desk. A ceiling so a hang is
    # reported as a hang and not as a slow day.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: onboard
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          # lua5.3: ArduPilot's Lua, for the OSD script's test (kestrel_osd_lua)
          sudo apt-get install -y -qq build-essential cmake libopencv-dev lua5.3

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        timeout-minutes: 10
        run: ctest --test-dir build --output-on-failure --timeout 300 -j 4

      # The Pi 5 installer, end to end except apt and systemd, into a scratch
      # prefix: binary, /etc/kestrel, the unit, the UART line -- and a second
      # run must keep the configuration it wrote the first time.
      - name: Pi installer (scratch prefix)
        run: |
          T="$RUNNER_TEMP/pi"; mkdir -p "$T/boot"; echo "arm_64bit=1" > "$T/boot/config.txt"
          export PREFIX="$T/usr" ETCDIR="$T/etc/kestrel" UNITDIR="$T/units" BOOTCFG="$T/boot/config.txt" BUILD="$PWD/build"
          deploy/install_pi5.sh --no-deps --no-build --enable-uart --user runner
          echo "# edited" >> "$T/etc/kestrel/kestrel.conf"
          deploy/install_pi5.sh --no-deps --no-build --enable-uart --user runner
          test "$(tail -1 "$T/etc/kestrel/kestrel.conf")" = "# edited"
          test "$(grep -c '^dtparam=uart0=on' "$T/boot/config.txt")" = 1
          grep -q "^User=runner" "$T/units/kestrel.service"
          "$T/usr/bin/kestrel" --config="$T/etc/kestrel/kestrel.conf" --dump-config | grep -q "rc.mode_map *= FLY,SHADOW,SCRIPT,AUTONOMY"
