org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9.0+ defaults to its own built-in Kotlin support, which needs migrating
# off the explicit org.jetbrains.kotlin.android plugin. Opting out for now so
# this fix stays scoped to the Gradle-9 compatibility error, not a second
# migration at the same time. Still supported through AGP 9.x; goes away in
# AGP 10 (2026), so revisit this before upgrading past the 9.x line.
android.builtInKotlin=false
