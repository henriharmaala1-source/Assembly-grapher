# kestrel.conf for a Pi 5 on ArduPilot, flown with an EdgeTX radio
# (RadioMaster Pocket). Installed to /etc/kestrel/kestrel.conf if none exists.
# Every key not set here keeps its default: ./kestrel --dump-config lists them.
# Setup and the radio/ArduPilot side: docs/pi5-ardupilot-setup.md.

# ---- the uplink ---------------------------------------------------------
# ArduPilot's flight mode picks how commands are sent: GUIDED velocity,
# GUIDED_NOGPS attitude, ALT_HOLD/LOITER/POSHOLD sticks, anything else nothing.
fc.uplink          = auto
# What a full stick means. The FC's own LOIT_SPEED / PILOT_SPEED_UP /
# PILOT_Y_RATE are read at connect and every command is rescaled to these.
fc.stick_mps       = 4
fc.stick_climb_mps = 1.5
fc.stick_yaw_dps   = 90

# ---- kestrel's mode from the radio --------------------------------------
# Channel indexes are 0-BASED: CH8 = 7. Use a channel ArduPilot does nothing
# with (RC8_OPTION = 0) and not FLTMODE_CH -- that one is ArduPilot's own
# flight-mode switch, which stays the pilot's.
#
# The wheel's travel is cut into equal bands, low to high. Four bands are
# 250 us each: easy to find by feel. FLY at the bottom sends nothing, so
# rolling the wheel down is always a way out.
rc.mode_aux     = 7
rc.mode_map     = FLY,SHADOW,SCRIPT,AUTONOMY
# A wheel has no detents: a band must be entered 30 us past its edge and held
# 0.3 s before the mode changes, so parking on an edge cannot flicker modes.
rc.mode_hyst_us = 30
rc.mode_dwell_s = 0.3

# GO: a 2-position switch on CH9. High = go (the mode acts), low = hold.
rc.go_aux       = 8
rc.go_us        = 1700

# ---- the mission (SCRIPT mode) -------------------------------------------
# Compiled on the PC (kestrel mission compile X.kms -o X.kmb), copied here.
# script.file   = /etc/kestrel/missions/cruise_door.kmb
